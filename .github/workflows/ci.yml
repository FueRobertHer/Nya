name: CI

# Typecheck and test on every pull request and every push to main. sync-preview.yml
# merges main into preview on every push, so a broken main would otherwise reach
# the demo deployment unattended. Runs the same pair as
# `bun run typecheck && bun run test`, so a green local run means a green CI run.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Supersede an in-flight run when new commits land on the same ref. Unlike
# sync-preview (which queues, because every merge must land), a stale CI result
# has no value once the code it described has been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Matches vercel.json's "bunVersion": "1.x", so CI and the deploy
          # build run the same major.
          bun-version: 1.x

      # --frozen-lockfile, not a plain install: next is pinned to a canary
      # build, and resolving it fresh could pull a different one than the
      # lockfile records. CI must test what Vercel will actually deploy.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # The Lua scripts (compare-and-set, the snapshot lock) are also tested
      # against a real Redis, which the runner does not ship. Those tests skip
      # without one locally, but fail under CI rather than pass unseen.
      - run: sudo apt-get update && sudo apt-get install -y redis-server

      # Each file's duration in the last run, so the slowest files start first
      # rather than one holding up the end. Every passing run saves its own
      # (the key never repeats, re-runs included) and restores the newest; the
      # first restores nothing.
      - uses: actions/cache@v6
        with:
          path: .bun-test-timings.json
          key: bun-test-timings-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bun-test-timings-

      # `bun test --parallel`: the files run across the runner's cores, each in
      # a fresh global. Run in one process, the suite took about five minutes.
      - run: bun run test --timings=.bun-test-timings.json --update-timings
